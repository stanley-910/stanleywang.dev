<!-- @dsCard group="Page" height=500 subtitle="Home full bleed; Leave closes the page colour in from the edges" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>HeroText</title></head>
<body>
<div id="root"></div>
<script>
  var M = window.Meadow, h = React.createElement;
  function App() {
    var s = React.useState(15)
    var away = React.useState(false)
    var veil = React.useState(0)
    // The page follows the hour, as on the site.
    React.useEffect(function () { document.documentElement.setAttribute('data-theme', M.pageFor(s[0])) }, [s[0]])
    // The veil runs 0 to 1 over 0.9s toward wherever we're headed.
    React.useEffect(function () {
      var raf = 0, last = performance.now(), target = away[0] ? 1 : 0
      function step(now) {
        var dt = (now - last) / 1000
        last = now
        var done = false
        veil[1](function (v) {
          var n = target ? Math.min(1, v + dt / 0.9) : Math.max(0, v - dt / 0.9)
          done = n === target
          return n
        })
        if (!done) raf = requestAnimationFrame(step)
      }
      raf = requestAnimationFrame(step)
      return function () { cancelAnimationFrame(raf) }
    }, [away[0]])
    return h('div', null,
      h(M.HeroText, {
        hour: s[0],
        veil: veil[0],
        height: 440,
        links: [
          { label: 'github', href: 'https://github.com/stanley-910' },
          { label: 'linkedin', href: 'https://www.linkedin.com/in/notstanleywang/' },
        ],
      },
        h('p', null,
          'Currently studying Computer Science at ', h('a', { href: 'https://www.mcgill.ca' }, 'McGill University.'),
          ' Most recently, I interned on Commerce & Identity at ', h('a', { href: 'https://www.ea.com' }, 'Electronic Arts.'),
          ' Before that, I wrote software with the ', h('a', { href: 'https://www.autodesk.com/ca-en/products/flow-production-tracking/overview' }, 'Flow PT team'),
          ' at Autodesk and engineered structural tooling for ', h('a', { href: 'https://beta.team/' }, 'BETA Technologies.'))),
      h('div', { className: 'cm-row', style: { alignItems: 'flex-end' } },
        h('div', { style: { width: 260 } }, h(M.TimeDial, { value: s[0], onChange: s[1] })),
        h('button', { type: 'button', className: 'cm-button', style: { flex: '0 0 auto' }, onClick: function () { away[1](!away[0]) } }, away[0] ? 'Home' : 'Leave')))
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App))
</script>
</body>
</html>
