<!-- @dsCard group="Site" height=340 subtitle="The phone's index, open on writing, day and night at 375px" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SiteIndex</title>
<style>
  body { margin: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 1px; background: var(--hairline); }
  .frame { width: 375px; box-sizing: border-box; padding: var(--space-3) var(--gutter) var(--space-4); background: var(--page); color: var(--ink); font-family: var(--font-mono); }
  .bar { display: flex; justify-content: space-between; align-items: center; height: 20px; color: var(--ink); }
  .bar svg { width: 16px; height: 16px; }
  .bar line { stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  .dots { fill: var(--ink-muted); }
  .pop { margin-top: 14px; padding: 6px; background: color-mix(in srgb, var(--page) 28%, transparent); border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); border-radius: var(--radius-card); }
  .pop ol { margin: 0; padding: 0; list-style: none; }
  .r { display: flex; align-items: center; min-height: 44px; padding-inline: 6px; color: var(--ink-muted); font-size: var(--text-small); text-decoration: none; }
  .r[aria-current] { color: var(--ink); }
  .m { flex: none; width: var(--space-3); font-size: var(--text-meta); color: color-mix(in srgb, var(--ink) 35%, transparent); }
  .r[aria-current] > .m { color: var(--ink); }
  .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: pre; }
  .l { flex: 1 1 0; min-width: var(--space-2); margin-inline: var(--space-1); overflow: hidden; white-space: nowrap; font-size: var(--text-meta); color: color-mix(in srgb, var(--ink) 35%, transparent); }
  .l::before { content: '· · · · · · · · · · · · · · · · · · · · · · · · · · · · · ·'; }
  .c { flex: none; font-size: var(--text-meta); color: var(--ink-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="frame" data-theme="light" id="light"></div>
  <div class="frame" data-theme="dark" id="dark"></div>
</div>
<template id="t">
  <div class="bar">
    <svg viewBox="0 0 16 16"><line x1="3" y1="3" x2="13" y2="13"/><line x1="3" y1="13" x2="13" y2="3"/></svg>
    <svg viewBox="0 0 16 16" class="dots"><circle cx="5" cy="5" r="1.6"/><circle cx="11" cy="5" r="1.6"/><circle cx="5" cy="11" r="1.6"/><circle cx="11" cy="11" r="1.6"/></svg>
  </div>
  <div class="pop"><ol>
    <li><a class="r" href="#"><span class="m">·</span><span class="n">meadow</span></a></li>
    <li><a class="r" href="#"><span class="m">·</span><span class="n">projects</span><span class="l"></span><span class="c">10</span></a></li>
    <li><a class="r" href="#"><span class="m">·</span><span class="n">photos</span><span class="l"></span><span class="c">4</span></a></li>
    <li><a class="r" href="#" aria-current="page"><span class="m">@</span><span class="n">writing</span><span class="l"></span><span class="c">4</span></a></li>
    <li><a class="r" href="#"><span class="m">·</span><span class="n">music</span><span class="l"></span><span class="c">soon</span></a></li>
  </ol></div>
</template>
<script>
  for (const id of ['light', 'dark']) document.getElementById(id).append(document.getElementById('t').content.cloneNode(true))
</script>
</body>
</html>
