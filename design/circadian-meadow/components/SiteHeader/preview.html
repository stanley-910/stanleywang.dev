<!-- @dsCard group="Site" height=260 subtitle="Top bar in day and night, desktop and 375px" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SiteHeader</title>
<style>
  body { margin: 0; }
  .frame { background: var(--page); color: var(--ink); padding: var(--space-4) var(--space-4) var(--space-3); }
  .frame.narrow { width: 375px; box-sizing: border-box; padding-inline: var(--gutter); }
  .bar { display: flex; align-items: center; gap: var(--space-4); font: 14px/20px var(--font-mono); }
  .bar ul { display: flex; gap: var(--space-4); margin: 0; padding: 0; list-style: none; }
  .narrow .bar { justify-content: space-between; gap: var(--space-1); font-size: 13px; }
  .narrow .bar ul { gap: 12px; }
  .bar a { color: var(--ink-muted); text-decoration: none; transition: color var(--duration-quick) var(--ease-calm); }
  .bar a:hover, .bar a[aria-current] { color: var(--ink); }
  .icon { width: 16px; height: 16px; color: var(--ink-muted); }
  .row { display: flex; flex-wrap: wrap; gap: 1px; background: var(--hairline); }
</style>
</head>
<body>
<div class="row">
  <div class="frame" data-theme="light" style="flex: 1 1 520px">
