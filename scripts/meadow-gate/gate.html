<!doctype html>
<meta charset="utf-8" />
<title>Meadow gate</title>
<style>
  body {
    margin: 0;
    background: #111;
    color: #ccc;
    font: 12px Menlo, monospace;
  }
  canvas {
    display: block;
    width: 1512px;
    height: 860px;
  }
</style>
<canvas id="scene"></canvas>
<pre id="log">loading</pre>
<script type="module">
  // A fixed clock and dice, set before the engine loads: the same sequence on every run.
  let seed = 0x9e3779b9
  Math.random = () => {
    seed = (seed + 0x6d2b79f5) | 0
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed)
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
  Date.now = () => 1794268800000
  // No workers: every frame is rasterised here, through the same Rasterizer a worker runs.
  window.Worker = undefined
  const { run } = await import('./scenario.mjs')
  window.__gate = { run, done: null }
  document.getElementById('log').textContent = 'ready'
</script>
